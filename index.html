<meta name="apple-mobile-web-app-capable" content="yes"><title>GiftWallet V25</title><style>body{font-family:Arial;margin:0;background:#f4f5f7;color:#222}.wrap{max-width:540px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 10px #0001}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #ccc;font-size:16px}button{background:#111;color:#fff;border:0;font-weight:bold}.secondary{background:#eee;color:#222}.danger{background:#b00020}.row{display:flex;gap:8px}.row>*{flex:1}.balance{font-size:22px;font-weight:bold}.small{font-size:13px;color:#666}.barcode{background:#fff;padding:12px;border-radius:8px;overflow:hidden;text-align:center}.barcode svg{max-width:100%;height:100px}.codeText{font-family:monospace;font-size:14px;letter-spacing:2px;word-break:break-all;margin-top:5px}.filePreview{width:100%;max-height:280px;object-fit:contain;border-radius:10px;background:#eee;margin-top:8px}.shopscroll{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}.shopbox{min-width:285px;max-width:285px;border-radius:14px;padding:13px;margin:8px 0;scroll-snap-align:start;flex:0 0 auto}.shophead{display:flex;justify-content:space-between;align-items:center}.zero{opacity:.65}.hidden{display:none}.use{font-size:18px}.remain{font-size:14px;color:#555}.trashscroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}.trashbox{min-width:210px;max-width:210px;flex:0 0 auto;scroll-snap-align:start;border-radius:12px;padding:10px}.trashbox button{padding:6px 8px;margin:3px 0;font-size:11px;border-radius:7px}.trashbox .small{font-size:11px}.trashbox .balance{font-size:16px}.bright{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;height:100dvh;min-height:100%;background:#fff;z-index:2147483647;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}.hiddenBright{display:none}.barcodeMode .wrap{visibility:hidden}.bright{background:#fff;color:#000}.bright button{background:#000;color:#fff}</style><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script></head><body><div id="lock" style="position:fixed;inset:0;background:#f4f5f7;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box"><div class="card" style="width:100%;max-width:380px;text-align:center"><h2>🔒 GiftWallet</h2><p class="small">Inserisci il PIN di accesso</p><input id="lockPin" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" placeholder="PIN"><button onclick="unlockApp()">ENTRA</button><div id="lockMsg" class="small"></div></div></div><div class="wrap" id="appWrap" style="display:none"><h1>🎁 GiftWallet V25</h1><p class="small">Gestione separata delle gift card, saldo residuo e utilizzo esatto.</p>
<div class="card"><h2>💳 Alla Cassa</h2><select id="payShop"></select><input id="payAmount" type="number" step="0.01" min="0" placeholder="Totale alla cassa €"><button onclick="calculate()">Calcola utilizzo</button><div id="result"></div></div>

</div><div id="bright" class="hiddenBright"></div><script>
const KEY='giftwallet_v5';const trashEl=document.getElementById('trash');const colors=['#dff3e3','#dcecff','#fff0c9','#f3ddff','#ffdfe5','#dff7f5','#e8e3ff','#ffe6cc'];let cards=JSON.parse(localStorage.getItem(KEY)||'[]');let trash=JSON.parse(localStorage.getItem('giftwallet_trash')||'[]');const euro=n=>'€ '+Number(n).toFixed(2).replace('.',',');function save(){localStorage.setItem(KEY,JSON.stringify(cards));render()}function scan(){file.setAttribute('capture','environment');file.click()}function importPhoto(){file.removeAttribute('capture');file.click()}async function decode(input){if(!input.files[0])return;const f=input.files[0];if(f.type==='application/pdf'){preview.innerHTML='<p>📄 File PDF acquisito. Potrai rivederlo dopo aver salvato la gift card.</p>';msg.textContent='Inserisci manualmente il codice barcode.';window._pendingFile={name:f.name,type:f.type,url:URL.createObjectURL(f)};return}const reader=new FileReader();reader.onload=async()=>{const dataUrl=reader.result;preview.innerHTML=f.type==='application/pdf'?'<p>📄 PDF acquisito. Potrai rivederlo dopo aver salvato la gift card.</p>':'<img class="filePreview" src="'+dataUrl+'">';window._pendingFile={name:f.name,type:f.type,data:dataUrl};if(f.type==='application/pdf'){msg.textContent='Inserisci manualmente il codice barcode.';return}const img=new Image();img.onload=async()=>{try{if(!('BarcodeDetector'in window)){msg.textContent='ℹ️ Immagine acquisita. Inserisci il codice manualmente.';return}const formats=await BarcodeDetector.getSupportedFormats();const d=new BarcodeDetector({formats});const r=await d.detect(img);if(r.length){code.value=r[0].rawValue;msg.textContent='✅ Barcode letto automaticamente.'}else msg.textContent='⚠️ Barcode non riconosciuto: inseriscilo manualmente.'}catch(e){msg.textContent='⚠️ Immagine acquisita; inserisci il codice manualmente.'}};img.src=dataUrl};reader.readAsDataURL(f)}function addCard(){const a=Number(amount.value),c=code.value.trim(),s=shop.value;if(a<=0||!c){alert('Inserisci valore iniziale e codice barcode.');return}cards.push({id:Date.now()+Math.random(),shop:s,initial:a,balance:a,code:c,pin:pin.value.trim(),fileName:window._pendingFile?.name||'',fileType:window._pendingFile?.type||'',fileData:window._pendingFile?.data||''});amount.value='';code.value='';pin.value='';msg.textContent='';preview.innerHTML='';window._pendingFile=null;save()}function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return h}function colorFor(s){return localStorage.getItem('color_'+s)||colors[Math.abs(hash(s))%colors.length]}function setColor(s,v){localStorage.setItem('color_'+s,v);render()}function resetCassa(){payAmount.value='';result.innerHTML='';window._payUse=null;window._payIndex=0;window._payInsufficient=false;window._payShortfall=0;window._payTotal=0;window._pendingSpend=null;}
function syncCassaToShop(shopName){if(!shopName)return;const opts=[...payShop.options];const opt=opts.find(o=>o.value===shopName||o.textContent===shopName);if(opt && payShop.value!==opt.value){payShop.value=opt.value;resetCassa();}}
function syncCassaFromScroll(){const sc=shops.querySelector('.shopscroll');if(!sc)return;const boxes=[...sc.querySelectorAll('.shopbox')];if(!boxes.length)return;const center=sc.scrollLeft+sc.clientWidth/2;let best=null,bestDist=Infinity;boxes.forEach(box=>{const boxCenter=box.offsetLeft+box.offsetWidth/2;const d=Math.abs(boxCenter-center);if(d<bestDist){bestDist=d;best=box}});if(best){const name=best.querySelector('.shophead b')?.textContent.trim();syncCassaToShop(name);}}
function setupShopScrollSync(){const sc=shops.querySelector('.shopscroll');if(!sc)return;if(sc._syncHandler)sc.removeEventListener('scroll',sc._syncHandler);let timer;const handler=()=>{clearTimeout(timer);timer=setTimeout(syncCassaFromScroll,120)};sc._syncHandler=handler;sc.addEventListener('scroll',handler,{passive:true});setTimeout(syncCassaFromScroll,50);}
function save(){localStorage.setItem(KEY,JSON.stringify(cards));localStorage.setItem('giftwallet_trash',JSON.stringify(trash));render()}
function render(){const list=[...new Set(cards.map(c=>c.shop))];shops.innerHTML=list.length?'<div class="shopscroll">'+list.map(s=>{const cs=cards.filter(c=>c.shop===s),t=cs.reduce((a,c)=>a+c.balance,0);return `<div class="shopbox" style="background:${colorFor(s)}"><div class="shophead"><b>${s}</b><input type="color" value="${colorFor(s)}" onchange="setColor('${s}',this.value)" style="width:45px;height:35px;padding:2px;margin:0"></div><div class="balance">${euro(t)}</div><div class="small">${cs.length} gift card/buono</div>${cs.map(c=>`<div style="background:#fff8;border-radius:10px;padding:9px;margin-top:7px"><b style="font-size:16px">Saldo residuo: ${euro(c.balance)}</b><div class="small">Valore iniziale: ${euro(c.initial)}</div><div>${c.code}${c.pin?' · PIN '+c.pin:''}</div>${c.fileName?`<button class="secondary" onclick="viewFile(${c.id})">📄 Vedi gift/file</button>`:''}<button onclick='showBarcode(${JSON.stringify(c.code)},${c.balance})'>📱 MOSTRA BARCODE</button></div>`).join('')}</div>`}).join('')+'</div>':'<div class="small">Nessuna gift card.</div>';payShop.innerHTML=list.map(s=>`<option>${s}</option>`).join('');renderTrash();setupShopScrollSync()}
function renderTrash(){if(!trash.length){trashEl.innerHTML='<div class="small">Il cestino è vuoto.</div>';return}trashEl.innerHTML='<div class="trashscroll">'+trash.map(c=>`<div class="trashbox" style="background:${colorFor(c.shop)}"><b>🗑️ ${c.shop}</b><div class="balance">Saldo: ${euro(0)}</div><div class="small">Valore iniziale: ${euro(c.initial)}</div><div class="small">${c.code}</div><div class="row"><button onclick='showBarcode(${JSON.stringify(c.code)},0)'>📱 BARCODE</button><button class="secondary" onclick="deleteTrash(${c.id})">ELIMINA</button></div><button class="secondary" onclick="restoreTrash(${c.id})">♻️ RIPRISTINA</button></div>`).join('')+'</div>'}
payShop.addEventListener('change',()=>{resetCassa();const sc=shops.querySelector('.shopscroll');if(!sc)return;const boxes=[...sc.querySelectorAll('.shopbox')];const target=boxes.find(b=>b.querySelector('.shophead b')?.textContent.trim()===payShop.value);if(target)target.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});});
function moveToTrash(c){const copy={...c,balance:0};trash.push(copy);cards=cards.filter(x=>x.id!==c.id)}
function deleteTrash(id){if(confirm('Eliminare definitivamente questa carta dal Cestino?')){trash=trash.filter(c=>c.id!==id);save()}}
function restoreTrash(id){const c=trash.find(x=>x.id===id);if(!c)return;const v=prompt('Inserisci il nuovo saldo da ripristinare (massimo '+euro(c.initial)+'):','0.00');if(v===null)return;const amount=Number(String(v).replace(',','.'));if(!Number.isFinite(amount)||amount<=0||amount>c.initial){alert('Importo non valido. Inserisci un valore maggiore di €0,00 e non superiore al valore iniziale.');return}const restored={...c,balance:Math.round(amount*100)/100,id:Date.now()+Math.random()};trash=trash.filter(x=>x.id!==id);cards.push(restored);save()}
function viewFile(id){const c=cards.find(x=>x.id===id);if(!c||!c.fileData){alert('File non disponibile.');return}if(c.fileType==='application/pdf'||c.fileName.toLowerCase().endsWith('.pdf')){const w=window.open();if(w){w.document.write('<iframe src=\"'+c.fileData+'\" style=\"width:100%;height:100vh;border:0\"></iframe>')}}else{result.innerHTML=`<div class="card"><b>${c.fileName}</b><img class="filePreview" src="${c.fileData}"><button onclick="calculate()">⬅️ Torna al pagamento</button></div>`}}function calculate(){const s=payShop.value,original=Number(payAmount.value);let need=Math.round(original*100);if(!s||need<=0){alert('Inserisci supermercato e importo.');return}const av=cards.filter(c=>c.shop===s&&c.balance>0);let total=av.reduce((a,c)=>a+Math.round(c.balance*100),0);const insufficient=total<need;const originalNeed=need;let use=[];for(const c of av){if(need<=0)break;let n=Math.min(Math.round(c.balance*100),need);use.push({id:c.id,cents:n});need-=n}if(!use.length){result.innerHTML='<div class="card"><h3>❌ Nessun saldo disponibile</h3><p>Non ci sono gift card utilizzabili per questo supermercato.</p></div>';return}showStep(use,0,insufficient,need,total)}function showAvailableCard(id){const c=cards.find(x=>x.id===id);if(!c)return;window._availableCardId=id;result.innerHTML=`<div class="card"><b>Gift card disponibile</b><div class="use">Saldo utilizzabile: <b>${euro(c.balance)}</b></div><div class="barcode"><svg id="availableBarcode"></svg><div class="codeText">${c.code}</div></div>${c.pin?'<div class="small">PIN: '+c.pin+'</div>':''}${c.fileData?`<button class="secondary" onclick="viewFile(${c.id})">📄 Vedi file originale</button>`:''}<button onclick='showBarcode(${JSON.stringify(c.code)},${c.balance})'>📱 MOSTRA BARCODE</button><button class="secondary" onclick="calculate()">⬅️ Torna a paga spesa</button></div>`;setTimeout(()=>renderBarcode(c.code,'#availableBarcode'),50)}function showStep(use,i,insufficient=false,shortfall=0,totalAvailable=0){window._payUse=use;window._payIndex=i;window._payInsufficient=insufficient;window._payShortfall=shortfall;window._payTotal=totalAvailable;const u=use[i],c=cards.find(x=>x.id===u.id);result.innerHTML=`<div class="card">${insufficient?`<div style="background:#fff0f0;border-radius:10px;padding:10px;margin-bottom:10px"><b>⚠️ Saldo gift insufficiente</b><br>Disponibile totale: <b>${euro(totalAvailable/100)}</b><br>Mancano: <b>${euro(shortfall/100)}</b><br>Puoi comunque utilizzare questa gift card e scalare il credito utilizzato.</div>`:''}<b>Gift card ${i+1} di ${use.length}</b><div class="use">Utilizzare: <b>${euro(u.cents/100)}</b></div><div class="remain">Saldo residuo dopo questa spesa: ${euro(c.balance-u.cents/100)} su valore iniziale ${euro(c.initial)}</div><div class="barcode"><svg id="cassaBarcode"></svg></div>${c.pin?'<div class="small">PIN: '+c.pin+'</div>':''}${c.fileName?`<button class="secondary" onclick="viewFile(${c.id})">📄 Vedi file originale</button>`:''}<button onclick='showBarcode(${JSON.stringify(c.code)},${u.cents/100})'>📱 MOSTRA BARCODE</button><div class="row">${i>0?`<button class="secondary" onclick='showStep(window._payUse,${i-1},window._payInsufficient,window._payShortfall,window._payTotal)'>⬅️ PRECEDENTE</button>`:'<span></span>'}${i<use.length-1?`<button class="secondary" onclick='showStep(window._payUse,${i+1},window._payInsufficient,window._payShortfall,window._payTotal)'>➡️ PROSSIMA CARD</button>`:'<span></span>'}</div><button onclick='confirmUse(${JSON.stringify(use)})'>✅ CONFERMA SPESA — SCALA QUESTA SPESA</button></div>`;}const _originalShowStep=showStep; showStep=function(use,i,insufficient=false,shortfall=0,totalAvailable=0){_originalShowStep(use,i,insufficient,shortfall,totalAvailable);const u=use[i];const c=cards.find(x=>x.id===u.id);if(c)setTimeout(()=>renderBarcode(c.code,'#cassaBarcode'),30)};function renderBarcode(code,selector='#barcodeSvg'){try{JsBarcode(selector,code,{format:'auto',displayValue:false,height:90,margin:5});}catch(e){try{JsBarcode('#barcodeSvg',code,{format:'CODE128',displayValue:false,height:90,margin:5});}catch(e2){}}}let wakeLock=null;async function lockScreen(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}async function unlockScreen(){try{if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}function showBarcode(code,amount){
const b=document.getElementById('bright');
b.className='bright';
b.innerHTML=`<div style="width:100%;height:100%;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;background:#fff"><div style="font-size:20px;font-weight:bold;margin-bottom:12px">Avvicina il barcode al lettore</div><div style="width:100%;max-width:720px;background:#fff;display:flex;justify-content:center;align-items:center"><svg id="bigBarcode" style="width:96%;height:auto;max-height:45vh"></svg></div><div style="font-family:monospace;font-size:15px;word-break:break-all;margin-top:8px">${code}</div><div style="font-size:20px;font-weight:bold;margin-top:10px">${euro(amount)}</div><button style="width:min(360px,90%);margin-top:18px;padding:14px;font-size:18px" onclick="closeBright()">CHIUDI</button></div>`;
document.body.classList.add('barcodeMode');
lockScreen();
// Il popup grafico è già realmente a pieno viewport e non dipende dal Fullscreen API.
// Se il browser lo consente, il Fullscreen API viene usato solo come miglioramento opzionale.
if(b.requestFullscreen){b.requestFullscreen().catch(()=>{});}
setTimeout(()=>{try{JsBarcode('#bigBarcode',code,{format:'auto',displayValue:false,height:220,width:3,margin:8});}catch(e){try{JsBarcode('#bigBarcode',code,{format:'CODE128',displayValue:false,height:220,width:3,margin:8});}catch(e2){}}},30);
}
function closeBright(){bright.className='hiddenBright';bright.innerHTML='';document.body.classList.remove('barcodeMode');unlockScreen();if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})}function confirmUse(use){
  let pending=[];
  use.forEach(u=>{let c=cards.find(x=>x.id===u.id);if(!c)return;const used=Math.min(c.balance,u.cents/100);const before=c.balance;const remaining=Math.round((c.balance-used)*100)/100;pending.push({card:c,before,remaining,used});});
  window._pendingSpend=pending;
  result.innerHTML='<div class="card"><h3>🧾 Conferma spesa</h3><p>Confermi di voler registrare questa spesa in <b>Alla Cassa</b>?</p>'+pending.map(x=>`<div style="background:#fff8;border-radius:10px;padding:10px;margin:8px 0"><b>${x.card.shop}</b><br>Utilizzato: <b>${euro(x.used)}</b><br>Saldo dopo la spesa: <b>${euro(x.remaining)}</b></div>`).join('')+'<div class="row"><button onclick="askScaleNow()">SÌ, CONFERMA</button><button class="secondary" onclick="cancelSpend()">ANNULLA</button></div></div>';
}
function askScaleNow(){
  result.innerHTML='<div class="card"><h3>⚠️ Scalo ora?</h3><p>Vuoi scalare adesso il credito utilizzato dalle gift card?</p><div class="row"><button onclick="finalizeSpend()">SÌ</button><button class="secondary" onclick="cancelSpend()">NO</button></div></div>';
}
function finalizeSpend(){
  (window._pendingSpend||[]).forEach(x=>{const c=cards.find(c=>c.id===x.card.id);if(c)c.balance=x.remaining;});
  const zero=(window._pendingSpend||[]).filter(x=>x.remaining<=0);
  zero.forEach(x=>{const c=cards.find(c=>c.id===x.card.id);if(c)moveToTrash(c);});
  save();window._pendingSpend=null;render();result.innerHTML='<div class="card"><b>✅ Spesa registrata</b><p>Saldi aggiornati.</p></div>';
}
function cancelSpend(){window._pendingSpend=null;save();result.innerHTML='<div class="card"><b>↩️ Operazione annullata</b><p>Nessun saldo è stato scalato.</p></div>'}
const BASE_PIN='H725LLLL';
function changePinInside(){const current=localStorage.getItem('giftwallet_pin')||BASE_PIN;const old=prompt('Inserisci il PIN attuale:');if(old!==current&&old!==BASE_PIN){alert('PIN errato.');return}const p=prompt('Inserisci il nuovo PIN di 6 cifre:');if(!p||!/^[0-9]{6}$/.test(p)){alert('Il PIN deve essere composto da 6 cifre.');return}localStorage.setItem('giftwallet_pin',p);alert('Nuovo PIN salvato. Il PIN di base resta sempre valido.');}
function unlockApp(){const pin=lockPin.value.trim();const saved=localStorage.getItem('giftwallet_pin')||BASE_PIN;if(pin===BASE_PIN||pin===saved){localStorage.setItem('giftwallet_pin',saved);lock.style.display='none';appWrap.style.display='block';lockMsg.textContent='';startAutoLock()}else lockMsg.textContent='PIN errato.'}
function lockApp(){lock.style.display='flex';appWrap.style.display='none';lockPin.value='';}
let autoLockTimer=null;function startAutoLock(){clearTimeout(autoLockTimer);autoLockTimer=setTimeout(lockApp,5*60*1000)}['click','touchstart','input'].forEach(ev=>document.addEventListener(ev,()=>{if(appWrap.style.display!=='none')startAutoLock()},{passive:true}));
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./giftwallet-sw.js').catch(()=>{}));}
</script></body></html>
