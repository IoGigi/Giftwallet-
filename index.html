<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftWallet V5</title><style>body{font-family:Arial;margin:0;background:#f4f5f7;color:#222}.wrap{max-width:540px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 10px #0001}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #ccc;font-size:16px}button{background:#111;color:#fff;border:0;font-weight:bold}.secondary{background:#eee;color:#222}.danger{background:#b00020}.row{display:flex;gap:8px}.row>*{flex:1}.balance{font-size:22px;font-weight:bold}.small{font-size:13px;color:#666}.barcode{background:#fff;padding:12px;border-radius:8px;overflow:hidden;text-align:center}.barcode svg{max-width:100%;height:100px}.codeText{font-family:monospace;font-size:14px;letter-spacing:2px;word-break:break-all;margin-top:5px}.filePreview{width:100%;max-height:280px;object-fit:contain;border-radius:10px;background:#eee;margin-top:8px}.shopscroll{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}.shopbox{min-width:285px;max-width:285px;border-radius:14px;padding:13px;margin:8px 0;scroll-snap-align:start;flex:0 0 auto}.shophead{display:flex;justify-content:space-between;align-items:center}.zero{opacity:.65}.hidden{display:none}.use{font-size:18px}.remain{font-size:14px;color:#555}.bright{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;font-size:28px}.hiddenBright{display:none}.barcodeMode .wrap{visibility:hidden}.bright{background:#fff;color:#000}.bright button{background:#000;color:#fff}</style><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script></head><body><div class="wrap"><h1>🎁 GiftWallet V5</h1><p class="small">Gestione separata delle gift card, saldo residuo e utilizzo esatto.</p><div class="card"><h2>Aggiungi gift card</h2><select id="shop"><option>Rossetto</option><option>Tosano</option><option>Migross</option><option>Conad</option><option>Coop</option><option>Esselunga</option><option>Despar</option><option>Lidl</option><option>Aldi</option><option>Pam</option><option>Carrefour</option><option>Martinelli</option><option>Eurospin</option></select><input id="amount" type="number" step="0.01" min="0" placeholder="Valore iniziale €"><div class="row"><button onclick="scan()">📷 Scansiona</button><button class="secondary" onclick="importPhoto()">📁 Importa foto/file</button></div><input id="file" class="hidden" type="file" accept="image/*,.pdf" onchange="decode(this)"><div id="preview"></div><input id="code" placeholder="Codice barcode"><input id="pin" placeholder="PIN / secondo codice (se presente)"><div id="msg" class="small"></div><button onclick="addCard()">💾 Salva gift card</button></div><div class="card"><h2>🏪 I miei supermercati</h2><div id="shops"></div></div><div class="card"><h2>💳 Paga spesa</h2><select id="payShop"></select><input id="payAmount" type="number" step="0.01" min="0" placeholder="Totale alla cassa €"><button onclick="calculate()">Calcola utilizzo</button><div id="result"></div></div></div><div id="bright" class="hiddenBright"></div><script>
const KEY='giftwallet_v5';const colors=['#dff3e3','#dcecff','#fff0c9','#f3ddff','#ffdfe5','#dff7f5','#e8e3ff','#ffe6cc'];let cards=JSON.parse(localStorage.getItem(KEY)||'[]');const euro=n=>'€ '+Number(n).toFixed(2).replace('.',',');function save(){localStorage.setItem(KEY,JSON.stringify(cards));render()}function scan(){file.setAttribute('capture','environment');file.click()}function importPhoto(){file.removeAttribute('capture');file.click()}async function decode(input){if(!input.files[0])return;const f=input.files[0];if(f.type==='application/pdf'){preview.innerHTML='<p>📄 File PDF acquisito. Potrai rivederlo dopo aver salvato la gift card.</p>';msg.textContent='Inserisci manualmente il codice barcode.';window._pendingFile={name:f.name,type:f.type,url:URL.createObjectURL(f)};return}const reader=new FileReader();reader.onload=async()=>{const dataUrl=reader.result;preview.innerHTML=f.type==='application/pdf'?'<p>📄 PDF acquisito. Potrai rivederlo dopo aver salvato la gift card.</p>':'<img class="filePreview" src="'+dataUrl+'">';window._pendingFile={name:f.name,type:f.type,data:dataUrl};if(f.type==='application/pdf'){msg.textContent='Inserisci manualmente il codice barcode.';return}const img=new Image();img.onload=async()=>{try{if(!('BarcodeDetector'in window)){msg.textContent='ℹ️ Immagine acquisita. Inserisci il codice manualmente.';return}const formats=await BarcodeDetector.getSupportedFormats();const d=new BarcodeDetector({formats});const r=await d.detect(img);if(r.length){code.value=r[0].rawValue;msg.textContent='✅ Barcode letto automaticamente.'}else msg.textContent='⚠️ Barcode non riconosciuto: inseriscilo manualmente.'}catch(e){msg.textContent='⚠️ Immagine acquisita; inserisci il codice manualmente.'}};img.src=dataUrl};reader.readAsDataURL(f)}function addCard(){const a=Number(amount.value),c=code.value.trim(),s=shop.value;if(a<=0||!c){alert('Inserisci valore iniziale e codice barcode.');return}cards.push({id:Date.now()+Math.random(),shop:s,initial:a,balance:a,code:c,pin:pin.value.trim(),fileName:window._pendingFile?.name||'',fileType:window._pendingFile?.type||'',fileData:window._pendingFile?.data||''});amount.value='';code.value='';pin.value='';msg.textContent='';preview.innerHTML='';window._pendingFile=null;save()}function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return h}function colorFor(s){return localStorage.getItem('color_'+s)||colors[Math.abs(hash(s))%colors.length]}function setColor(s,v){localStorage.setItem('color_'+s,v);render()}function render(){const list=[...new Set(cards.map(c=>c.shop))];shops.innerHTML=list.length?'<div class="shopscroll">'+list.map(s=>{const cs=cards.filter(c=>c.shop===s),t=cs.reduce((a,c)=>a+c.balance,0);return `<div class="shopbox" style="background:${colorFor(s)}"><div class="shophead"><b>${s}</b><input type="color" value="${colorFor(s)}" onchange="setColor('${s}',this.value)" style="width:45px;height:35px;padding:2px;margin:0"></div><div class="balance">${euro(t)}</div><div class="small">${cs.length} gift card</div>${cs.map(c=>`<div class="${c.balance<=0?'zero':''}" style="background:#fff8;border-radius:10px;padding:9px;margin-top:7px"><b>Saldo utilizzabile: ${euro(c.balance)}</b><div class="small">Valore iniziale: ${euro(c.initial)}</div><div>${c.code}${c.pin?' · PIN '+c.pin:''}</div>${c.fileName?`<button class="secondary" onclick="viewFile(${c.id})">📄 Vedi gift/file</button>`:''}<button class="secondary" onclick="deleteCard(${c.id})">🗑️ Elimina</button></div>`).join('')}</div>`}).join('')+'</div>':'<div class="small">Nessuna gift card.</div>';payShop.innerHTML=list.map(s=>`<option>${s}</option>`).join('')}function deleteCard(id){if(confirm('Eliminare questa gift card?')){cards=cards.filter(c=>c.id!==id);save()}}function viewFile(id){const c=cards.find(x=>x.id===id);if(!c||!c.fileData){alert('File non disponibile.');return}if(c.fileType==='application/pdf'||c.fileName.toLowerCase().endsWith('.pdf')){const w=window.open();if(w){w.document.write('<iframe src=\"'+c.fileData+'\" style=\"width:100%;height:100vh;border:0\"></iframe>')}}else{result.innerHTML=`<div class="card"><b>${c.fileName}</b><img class="filePreview" src="${c.fileData}"><button onclick="calculate()">⬅️ Torna al pagamento</button></div>`}}function calculate(){const s=payShop.value,original=Number(payAmount.value);let need=Math.round(original*100);if(!s||need<=0){alert('Inserisci supermercato e importo.');return}const av=cards.filter(c=>c.shop===s&&c.balance>0);let total=av.reduce((a,c)=>a+Math.round(c.balance*100),0);if(total<need){const diff=need-total;result.innerHTML=`<div class="card"><h3>❌ Saldo insufficiente</h3><div class="balance">Disponibile: ${euro(total/100)}</div><div class="use">Mancano: <b>${euro(diff/100)}</b></div><hr><b>Gift card con saldo attivo:</b>${av.map((c,idx)=>`<div style="background:#fff8;border-radius:10px;padding:9px;margin-top:7px"><b>${c.shop}</b><br>Saldo utilizzabile: <b>${euro(c.balance)}</b><br><span class="small">Valore iniziale: ${euro(c.initial)}</span><button onclick='showAvailableCard(${c.id})'>📱 USA QUESTA GIFT / BARCODE</button></div>`).join('')}</div>`;return}let use=[];for(const c of av){if(need<=0)break;let n=Math.min(Math.round(c.balance*100),need);use.push({id:c.id,cents:n});need-=n}showStep(use,0)}function showAvailableCard(id){const c=cards.find(x=>x.id===id);if(!c)return;window._availableCardId=id;result.innerHTML=`<div class="card"><b>Gift card disponibile</b><div class="use">Saldo utilizzabile: <b>${euro(c.balance)}</b></div><div class="barcode"><svg id="availableBarcode"></svg><div class="codeText">${c.code}</div></div>${c.pin?'<div class="small">PIN: '+c.pin+'</div>':''}${c.fileData?`<button class="secondary" onclick="viewFile(${c.id})">📄 Vedi file originale</button>`:''}<button onclick='showBarcode(${JSON.stringify(c.code)},${c.balance})'>📱 MOSTRA BARCODE</button><button class="secondary" onclick="calculate()">⬅️ Torna a paga spesa</button></div>`;setTimeout(()=>renderBarcode(c.code,'#availableBarcode'),50)}function showStep(use,i){window._payUse=use;window._payIndex=i;const u=use[i],c=cards.find(x=>x.id===u.id);result.innerHTML=`<div class="card"><b>Gift card ${i+1} di ${use.length}</b><div class="use">Utilizzare: <b>${euro(u.cents/100)}</b></div><div class="remain">Saldo residuo dopo questa spesa: ${euro(c.balance-u.cents/100)} su valore iniziale ${euro(c.initial)}</div><div class="barcode"><svg id="barcodeSvg"></svg><div class="codeText">${c.code}</div></div>${c.pin?'<div class="small">PIN: '+c.pin+'</div>':''}${c.fileName?`<button class="secondary" onclick="viewFile(${c.id})">📄 Vedi file originale</button>`:''}<button onclick="showBarcode(${JSON.stringify(c.code)},${u.cents/100})">📱 MOSTRA BARCODE</button><div class="row">${i>0?`<button class="secondary" onclick='showStep(window._payUse,${i-1})'>⬅️ PRECEDENTE</button>`:'<span></span>'}${i<use.length-1?`<button class="secondary" onclick='showStep(window._payUse,${i+1})'>➡️ PROSSIMA CARD</button>`:'<span></span>'}</div>${i===use.length-1?`<button onclick='confirmUse(${JSON.stringify(use)})'>✅ CONFERMA SPESA</button>`:''}</div>`;setTimeout(()=>renderBarcode(c.code),50)}function renderBarcode(code,selector='#barcodeSvg'){try{JsBarcode(selector,code,{format:'auto',displayValue:false,height:90,margin:5});}catch(e){try{JsBarcode('#barcodeSvg',code,{format:'CODE128',displayValue:false,height:90,margin:5});}catch(e2){}}}let wakeLock=null;async function lockScreen(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}async function unlockScreen(){try{if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}function showBarcode(code,amount){const b=document.getElementById('bright');b.className='bright';b.innerHTML=`<div style="width:96%;text-align:center"><div style="font-size:20px;margin-bottom:8px">Avvicina il barcode al lettore</div><svg id="bigBarcode"></svg><div style="font-family:monospace;font-size:15px;word-break:break-all">${code}</div><div style="font-size:20px;margin-top:10px">${euro(amount)}</div><button style="margin-top:15px" onclick="closeBright()">CHIUDI</button></div>`;setTimeout(()=>{try{JsBarcode('#bigBarcode',code,{format:'auto',displayValue:false,height:150,width:2,margin:10});}catch(e){try{JsBarcode('#bigBarcode',code,{format:'CODE128',displayValue:false,height:150,width:2,margin:10});}catch(e2){}}},30);if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});document.body.classList.add('barcodeMode');lockScreen()}function closeBright(){bright.className='hiddenBright';bright.innerHTML='';document.body.classList.remove('barcodeMode');unlockScreen();if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})}function confirmUse(use){let zero=[];use.forEach(u=>{let c=cards.find(x=>x.id===u.id);c.balance=Math.round((c.balance-u.cents/100)*100)/100;if(c.balance===0)zero.push(c)});save();if(zero.length){result.innerHTML='<div class="card"><b>🔔 Gift card esaurita</b>'+zero.map(c=>`<p>${c.shop} — ${c.code}</p><button class="danger" onclick="deleteCard(${c.id});this.parentElement.innerHTML='<p>✅ Gift eliminata.</p>'">ELIMINA</button><button class="secondary" onclick="this.parentElement.innerHTML='<p>Gift mantenuta a €0,00.</p>'">MANTIENI</button>`).join('')+'</div>'}else result.innerHTML='<p>✅ Spesa registrata e saldi aggiornati.</p>'}render();</script></body></html>
