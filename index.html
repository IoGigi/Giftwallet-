<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>GiftWallet Demo</title><style>body{font-family:Arial;margin:0;background:#f3f4f6;color:#111}header{background:#111827;color:#fff;padding:20px}main{max-width:600px;margin:auto;padding:15px}.card{background:#fff;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #0001}input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}button{background:#111827;color:#fff;font-weight:bold}.gift{border-top:1px solid #eee;padding:12px 0}.row{display:flex;gap:8px}.row button{flex:1}.bal{font-size:24px;font-weight:bold}.barcode{height:55px;margin-top:8px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 5px,#111 5px 6px,#fff 6px 9px)}.small{font-size:12px;color:#666}.ok{padding:10px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:9px}</style></head><body><header><h1>GiftWallet</h1><div>Demo gestione gift card per supermercato</div></header><main><div class='card'><h3>➕ Aggiungi gift card</h3><select id='shop'><option>Rossetto</option><option>Tosano</option><option>Migross</option><option>Conad</option></select><input id='amt' type='number' step='0.01' placeholder='Importo iniziale, es. 83.47'><input id='code' placeholder='Codice carta (demo)'><button onclick='add()'>AGGIUNGI</button></div><div id='list'></div><div class='card'><h3>🧾 Simula spesa alla cassa</h3><select id='payShop'><option>Rossetto</option><option>Tosano</option><option>Migross</option><option>Conad</option></select><input id='payAmt' type='number' step='0.01' placeholder='Totale cassa, es. 63.20'><button onclick='calc()'>CALCOLA CARTE DA USARE</button><div id='res'></div></div></main><script>let cards=JSON.parse(localStorage.getItem('gw')||'[]');const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);function save(){localStorage.setItem('gw',JSON.stringify(cards));render()}function add(){let shop=shopEl().value,a=+amtEl().value,c=codeEl().value||('CARD-'+Date.now());if(!(a>0))return alert('Inserisci un importo');cards.push({id:Date.now(),shop,code:c,initial:+a.toFixed(2),balance:+a.toFixed(2)});amtEl().value='';codeEl().value='';save()}function shopEl(){return document.getElementById('shop')}function amtEl(){return document.getElementById('amt')}function codeEl(){return document.getElementById('code')}function render(){let groups={};cards.forEach(c=>(groups[c.shop]??=[]).push(c));let h='';for(let s in groups){let tot=groups[s].reduce((x,c)=>x+c.balance,0);h+=`<div class='card'><b>🛒 ${s}</b><div class='bal'>${eur(tot)}</div><div class='small'>Saldo cumulato</div>`;groups[s].forEach(c=>h+=`<div class='gift'><div><b>${c.code}</b> — ${eur(c.balance)}</div><div class='row'><button onclick='barcode(${c.id})'>MOSTRA BARCODE</button><button onclick='manual(${c.id})'>SCALA</button></div><div id='b${c.id}' style='display:none'><div class='barcode'></div><div class='small'>${c.code}</div></div></div>`);h+='</div>'}document.getElementById('list').innerHTML=h||`<div class='card small'>Nessuna gift card. Aggiungine una sopra.</div>`}function barcode(id){let x=document.getElementById('b'+id);x.style.display=x.style.display==='none'?'block':'none'}function manual(id){let c=cards.find(x=>x.id===id),v=+(prompt('Quanto hai utilizzato?','0.00')||0);if(v>0&&v<=c.balance){c.balance=+(c.balance-v).toFixed(2);save()}}function calc(){let s=document.getElementById('payShop').value,t=+(document.getElementById('payAmt').value||0),arr=cards.filter(c=>c.shop===s&&c.balance>0).sort((a,b)=>b.balance-a.balance);let total=arr.reduce((x,c)=>x+c.balance,0),r=t,chosen=[];if(!(t>0))return;for(let c of arr){if(r<=.001)break;let u=Math.min(c.balance,r);chosen.push([c,u]);r=+(r-u).toFixed(2)}let box=document.getElementById('res');if(total+0.001<t){box.innerHTML=`<div class='card' style='background:#fff1f2'>Saldo ${s}: ${eur(total)}<br>Mancano ${eur(t-total)}</div>`;return}box.innerHTML=`<div class='ok'><b>Totale: ${eur(t)}</b><br><br>`+chosen.map(([c,u])=>`<div style='margin:8px 0'><b>${c.code}</b> → ${eur(u)} <button onclick='barcode(${c.id})'>BARCODE</button></div>`).join('')+`</div><button onclick='confirmUse(${JSON.stringify(chosen.map(x=>[x[0].id,x[1]]))})'>CONFERMA UTILIZZO</button>`}function confirmUse(items){items.forEach(([id,u])=>{let c=cards.find(x=>x.id===id);c.balance=+(c.balance-u).toFixed(2)});save();document.getElementById('res').innerHTML='<div class="ok"><b>Utilizzo registrato.</b><br>Saldi aggiornati.</div>'}render();</script></body></html>
