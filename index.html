<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftWallet V4</title><style>body{font-family:Arial;margin:0;background:#f4f5f7;color:#222}.wrap{max-width:540px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 10px #0001}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #ccc;font-size:16px}button{background:#111;color:#fff;border:0;font-weight:bold}.secondary{background:#eee;color:#222}.danger{background:#b00020}.row{display:flex;gap:8px}.row>*{flex:1}.balance{font-size:22px;font-weight:bold}.small{font-size:13px;color:#666}.barcode{font-family:monospace;font-size:19px;letter-spacing:2px;word-break:break-all;background:#f7f7f7;padding:12px;border-radius:8px}.shopbox{border-radius:14px;padding:13px;margin:8px 0}.shophead{display:flex;justify-content:space-between;align-items:center}.zero{opacity:.65}.hidden{display:none}</style></head><body><div class="wrap"><h1>🎁 GiftWallet V4</h1><p class="small">Gift card separate per supermercato, saldo cumulativo e pagamento esatto.</p><div class="card"><h2>Aggiungi gift card</h2><select id="shop"><option>Rossetto</option><option>Tosano</option><option>Migross</option><option>Conad</option><option>Coop</option><option>Esselunga</option><option>Despar</option><option>Lidl</option><option>Aldi</option><option>Pam</option><option>Carrefour</option><option>Martinelli</option><option>Eurospin</option></select><input id="amount" type="number" step="0.01" min="0" placeholder="Valore iniziale €"><div class="row"><button onclick="scan()">📷 Scansiona</button><button class="secondary" onclick="importPhoto()">📁 Importa foto</button></div><input id="file" class="hidden" type="file" accept="image/*" onchange="decode(this)"><input id="code" placeholder="Codice barcode"><input id="pin" placeholder="PIN / secondo codice (se presente)"><div id="msg" class="small"></div><button onclick="addCard()">💾 Salva gift card</button></div><div class="card"><h2>🏪 I miei supermercati</h2><div id="shops"></div></div><div class="card"><h2>💳 Paga spesa</h2><select id="payShop"></select><input id="payAmount" type="number" step="0.01" min="0" placeholder="Totale alla cassa €"><button onclick="calculate()">Calcola utilizzo</button><div id="result"></div></div></div><script>
const KEY='giftwallet_v4';const colors=['#dff3e3','#dcecff','#fff0c9','#f3ddff','#ffdfe5','#dff7f5','#e8e3ff','#ffe6cc'];let cards=JSON.parse(localStorage.getItem(KEY)||'[]');const euro=n=>'€ '+Number(n).toFixed(2).replace('.',',');function save(){localStorage.setItem(KEY,JSON.stringify(cards));render()}function scan(){file.setAttribute('capture','environment');file.click()}function importPhoto(){file.removeAttribute('capture');file.click()}async function decode(input){if(!input.files[0])return;const img=new Image();img.onload=async()=>{try{if(!('BarcodeDetector'in window)){msg.textContent='ℹ️ Foto acquisita. Inserisci il codice manualmente.';return}const formats=await BarcodeDetector.getSupportedFormats();const d=new BarcodeDetector({formats});const r=await d.detect(img);if(r.length){code.value=r[0].rawValue;msg.textContent='✅ Barcode letto automaticamente.'}else msg.textContent='⚠️ Barcode non riconosciuto.'}catch(e){msg.textContent='⚠️ Immagine acquisita; inserisci il codice manualmente.'}};img.src=URL.createObjectURL(input.files[0])}function addCard(){const a=Number(amount.value),c=code.value.trim(),s=shop.value;if(a<=0||!c){alert('Inserisci valore iniziale e codice barcode.');return}cards.push({id:Date.now()+Math.random(),shop:s,initial:a,balance:a,code:c,pin:pin.value.trim()});amount.value='';code.value='';pin.value='';msg.textContent='';save()}function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return h}function colorFor(s){return localStorage.getItem('color_'+s)||colors[Math.abs(hash(s))%colors.length]}function setColor(s,v){localStorage.setItem('color_'+s,v);render()}function render(){const list=[...new Set(cards.map(c=>c.shop))];shops.innerHTML=list.length?list.map(s=>{const cs=cards.filter(c=>c.shop===s),t=cs.reduce((a,c)=>a+c.balance,0);return `<div class="shopbox" style="background:${colorFor(s)}"><div class="shophead"><b>${s}</b><input type="color" value="${colorFor(s)}" onchange="setColor('${s}',this.value)" style="width:45px;height:35px;padding:2px;margin:0"></div><div class="balance">${euro(t)}</div><div class="small">${cs.length} gift card</div>${cs.map(c=>`<div class="${c.balance<=0?'zero':''}" style="background:#fff8;border-radius:10px;padding:9px;margin-top:7px"><b>${euro(c.balance)}</b> — ${c.code}${c.pin?' · PIN '+c.pin:''}<button class="secondary" onclick="deleteCard(${c.id})">🗑️ Elimina</button></div>`).join('')}</div>`}).join(''):'<div class="small">Nessuna gift card.</div>';payShop.innerHTML=list.map(s=>`<option>${s}</option>`).join('')}function deleteCard(id){if(confirm('Eliminare questa gift card?')){cards=cards.filter(c=>c.id!==id);save()}}function calculate(){const s=payShop.value,original=Number(payAmount.value);let need=Math.round(original*100);if(!s||need<=0){alert('Inserisci supermercato e importo.');return}const av=cards.filter(c=>c.shop===s&&c.balance>0);let total=av.reduce((a,c)=>a+Math.round(c.balance*100),0);if(total<need){result.innerHTML='<p>❌ Saldo insufficiente. Disponibile '+euro(total/100)+'</p>';return}let use=[];for(const c of av){if(need<=0)break;let n=Math.min(Math.round(c.balance*100),need);use.push({id:c.id,cents:n});need-=n}showStep(use,0)}function showStep(use,i){const u=use[i],c=cards.find(x=>x.id===u.id);result.innerHTML=`<div class="card"><b>Gift card ${i+1} di ${use.length}</b><div class="balance">Usa ${euro(u.cents/100)}</div><div class="barcode">${c.code}</div>${c.pin?'<div class="small">PIN: '+c.pin+'</div>':''}<button onclick="alert('Barcode: ${c.code}\\nImporto da usare: ${euro(u.cents/100)}')">📱 MOSTRA CODICE</button>${i<use.length-1?`<button class="secondary" onclick='showStep(${JSON.stringify(use)},${i+1})'>➡️ PROSSIMA CARD</button>`:`<button onclick='confirmUse(${JSON.stringify(use)})'>✅ CONFERMA SPESA</button>`}</div>`}function confirmUse(use){let zero=[];use.forEach(u=>{let c=cards.find(x=>x.id===u.id);c.balance=Math.round((c.balance-u.cents/100)*100)/100;if(c.balance===0)zero.push(c)});save();if(zero.length){result.innerHTML='<div class="card"><b>🔔 Gift card esaurita</b>'+zero.map(c=>`<p>${c.shop} — ${c.code}</p><button class="danger" onclick="deleteCard(${c.id});this.parentElement.innerHTML='<p>✅ Gift eliminata.</p>'">ELIMINA</button><button class="secondary" onclick="this.parentElement.innerHTML='<p>Gift mantenuta a €0,00.</p>'">MANTIENI</button>`).join('')+'</div>'}else result.innerHTML='<p>✅ Spesa registrata e saldi aggiornati.</p>'}render();</script></body></html>
